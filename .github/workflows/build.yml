
name: Build Native Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout native mod
        uses: actions/checkout@v4

      - name: Checkout REPENTOGON headers
        uses: actions/checkout@v4
        with:
          repository: TeamREPENTOGON/REPENTOGON
          ref: 1.1.3
          path: REPENTOGON

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build DLL
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /std:c++17 /MD /I REPENTOGON/include /I REPENTOGON/libzhl /I REPENTOGON/libs/lua Main_Planet.cpp libzhl.lib /link /OUT:zhlMain_Planet.dll
          if errorlevel 1 exit /b 1

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Main_Planet
          path: zhlMain_Planet.dll
